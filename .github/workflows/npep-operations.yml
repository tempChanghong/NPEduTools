name: NPEP three-repository operations acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Full NPEduTools commit SHA (empty uses workflow commit)
        type: string
        required: false
        default: ''
      web_sha:
        description: Full NPClassworks commit SHA (empty uses checked-in source record)
        type: string
        required: false
        default: ''
      backend_sha:
        description: Full NPClassworksKV commit SHA (empty uses checked-in source record)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      desktop_sha:
        type: string
        required: true
      web_sha:
        type: string
        required: false
        default: ''
      backend_sha:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: npep-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operations:
    name: Operations overview and diagnostics
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DESKTOP_SHA: ${{ inputs.desktop_sha || github.event.pull_request.head.sha || github.sha }}
      WEB_SHA: ${{ inputs.web_sha }}
      BACKEND_SHA: ${{ inputs.backend_sha }}
    steps:
      - name: Use stable source line endings on the disposable runner
        run: git config --global core.autocrlf false
      - name: Require immutable desktop reference before checkout
        run: |
          if ($env:DESKTOP_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Desktop reference must be a full commit SHA.' }
      - uses: actions/checkout@v4
        with:
          repository: tempChanghong/NPEduTools
          ref: ${{ env.DESKTOP_SHA }}
          path: NPEduTools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Resolve immutable web and backend references
        run: node NPEduTools/scripts/resolve-npep-operations-ci.mjs
      - uses: actions/checkout@v4
        with:
          repository: tempChanghong/NPClassworks
          ref: ${{ env.WEB_SHA }}
          path: NPClassworks
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tempChanghong/NPClassworksKV
          ref: ${{ env.BACKEND_SHA }}
          path: NPClassworksKV
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: NPEduTools/global.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: NPClassworks
      - run: pnpm install --frozen-lockfile
        working-directory: NPClassworksKV
      - run: pnpm exec playwright install chromium
        working-directory: NPClassworks
      - name: Locate native PostgreSQL (install only on disposable runner if missing)
        run: |
          $candidates = @(Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending)
          if (-not $candidates.Count) {
            choco install postgresql17 --yes --no-progress --params '/Password:isolated-ci-only /Port:55439'
            if ($LASTEXITCODE -ne 0) { throw 'Native PostgreSQL installation failed.' }
            $candidates = @(Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory)
          }
          $bin = $candidates | ForEach-Object { Join-Path $_.FullName 'bin' } | Where-Object {
            (Test-Path (Join-Path $_ 'initdb.exe')) -and (Test-Path (Join-Path $_ 'pg_ctl.exe')) -and
            (Test-Path (Join-Path $_ 'pg_dump.exe')) -and (Test-Path (Join-Path $_ 'pg_restore.exe'))
          } | Select-Object -First 1
          if (-not $bin) { throw 'Complete native PostgreSQL tools were not found.' }
          "NPEP_TEST_PG_BIN=$bin" >> $env:GITHUB_ENV
      - name: Run the local acceptance entry against clean pinned sources
        working-directory: NPEduTools
        run: |
          ./scripts/test-npep-operations.ps1 -Browser -Database -RequireClean `
            -DesktopCommit $env:DESKTOP_SHA -WebCommit $env:WEB_SHA -BackendCommit $env:BACKEND_SHA
      - name: Preserve scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npep-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            NPEduTools/.artifacts/npep-operations/**/result.json
            NPEduTools/.artifacts/npep-operations/**/source-inputs.json
            NPEduTools/.artifacts/npep-operations/**/contract-result.json
            NPEduTools/.artifacts/npep-operations/**/comparison-result.json
            NPEduTools/.artifacts/npep-operations/**/browser.json
            NPEduTools/.artifacts/npep-operations/**/*.trx
            NPEduTools/.artifacts/npep-operations/**/*.stdout.log
            NPEduTools/.artifacts/npep-operations/**/*.stderr.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
